<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VacciReg Mali</title>
<style>
:root{--p:#087f5b;--bg:#f5f7f9;--card:#fff;--text:#18212b;--muted:#64748b;--danger:#c92a2a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:700}
button.secondary{background:#e9eef2;color:#223}button.danger{background:var(--danger)}
.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-weight:900;font-size:22px}.brand span{color:var(--p)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:#e6eee9;color:#155d48}.nav button.active{background:var(--p);color:#fff}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 5px 20px #0000000d;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{font-size:30px;font-weight:900}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #edf0f2;text-align:left}th{font-size:13px;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid #d8dee4;border-radius:10px;background:#fff}.field{display:grid;gap:6px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1}.hide{display:none}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e6f6ef;color:#14664d;font-size:12px;font-weight:700}.over{background:#fff0f0;color:#a61e1e}.login{max-width:440px;margin:9vh auto}.logo{font-size:34px;font-weight:950;text-align:center;margin-bottom:20px}.small{font-size:13px}.error{color:#b42318;margin:8px 0}.toast{position:fixed;bottom:20px;right:20px;background:#18212b;color:white;padding:12px 16px;border-radius:10px;display:none}
@media(max-width:650px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}table{font-size:13px}.card{padding:14px}}
</style></head><body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), api=location.origin+"/api";
let token=localStorage.getItem("vr_token"), me=null, tab="dashboard";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function req(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}
 const r=await fetch(api+path,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){logout();throw Error(d.error||"Session expirée")}if(!r.ok)throw Error(d.error||"Erreur");return d}
function toast(s){let t=$("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
function login(){app.innerHTML=`<div class="wrap"><div class="card login"><div class="logo">Vacci<span style="color:var(--p)">Reg</span> Mali</div><p class="muted">Registre numérique de vaccination</p><div class="field"><label>Email</label><input id="email" value="admin@vaccireg.local"></div><br><div class="field"><label>Mot de passe</label><input id="pass" type="password" placeholder="Mot de passe administrateur"></div><p id="err" class="error"></p><button style="width:100%" onclick="doLogin()">Se connecter</button><p class="small muted">Changez le mot de passe administrateur avant toute mise en production.</p></div></div>`}
async function doLogin(){try{let d=await req("/auth/login",{method:"POST",body:{email:$("#email").value,password:$("#pass").value}});token=d.token;localStorage.setItem("vr_token",token);me=d.user;render()}catch(e){$("#err").textContent=e.message}}
function logout(){localStorage.removeItem("vr_token");token=null;me=null;login()}
async function render(){if(!me){try{me=(await req("/me")).user}catch{login();return}} app.innerHTML=`<div class="wrap">
<div class="top"><div><div class="brand">Vacci<span>Reg</span> Mali</div><div class="muted small">${esc(me.name)} · ${esc(me.role)}</div></div><button class="secondary" onclick="logout()">Déconnexion</button></div>
<div class="nav">
${["dashboard","people","vaccinations"].map(x=>`<button class="${tab==x?"active":""}" onclick="tab='${x}';render()">${x==="dashboard"?"Tableau de bord":x==="people"?"Personnes":"Vaccinations"}</button>`).join("")}
${me.role==="admin"?`<button class="${tab==="admin"?"active":""}" onclick="tab='admin';render()">Administration</button>`:""}
</div><br><div id="content"></div></div>`;
if(tab==="dashboard")dashboard();if(tab==="people")people();if(tab==="vaccinations")vaccinations();if(tab==="admin")adminPage()}
async function dashboard(){let d=await req("/dashboard");$("#content").innerHTML=`<div class="grid">
<div class="card"><div class="muted">Personnes</div><div class="stat">${d.people}</div></div><div class="card"><div class="muted">Vaccinations</div><div class="stat">${d.vaccinations}</div></div><div class="card"><div class="muted">Rappels en retard</div><div class="stat">${d.overdue}</div></div><div class="card"><div class="muted">Centres</div><div class="stat">${d.centers}</div></div></div>
<div class="card"><h2>Bienvenue</h2><p>VacciReg Mali centralise le registre de vaccination et permet le suivi des rappels par centre de santé.</p></div>`}
async function people(){let q=prompt("Recherche par nom, village ou téléphone (laisser vide pour tout afficher)","")??"";let rows=await req("/people?q="+encodeURIComponent(q));$("#content").innerHTML=`<div class="card"><div class="row"><div><h2>Personnes</h2><p class="muted">${rows.length} résultat(s)</p></div><button onclick="newPerson()">+ Ajouter</button></div><div style="overflow:auto"><table><tr><th>Nom</th><th>Date naissance</th><th>Sexe</th><th>Village</th><th>Téléphone</th><th></th></tr>${rows.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.dob)}</td><td>${esc(p.sex)}</td><td>${esc(p.village)}</td><td>${esc(p.phone)}</td><td><button class="danger small" onclick="delPerson(${p.id})">Supprimer</button></td></tr>`).join("")}</table></div></div>`}
async function newPerson(){let name=prompt("Nom complet");if(!name)return;let dob=prompt("Date de naissance (AAAA-MM-JJ)")||"",sex=prompt("Sexe (M/F)")||"",village=prompt("Village/quartier")||"",phone=prompt("Téléphone")||"";try{await req("/people",{method:"POST",body:{full_name:name,dob,sex,village,phone}});toast("Personne ajoutée");people()}catch(e){alert(e.message)}}
async function delPerson(id){if(!confirm("Supprimer cette personne et ses vaccinations ?"))return;try{await req("/people/"+id,{method:"DELETE"});toast("Supprimé");people()}catch(e){alert(e.message)}}
async function vaccinations(){let rows=await req("/vaccinations");$("#content").innerHTML=`<div class="card"><div class="row"><div><h2>Vaccinations</h2><p class="muted">${rows.length} enregistrement(s)</p></div><button onclick="newVacc()">+ Enregistrer</button></div><div style="overflow:auto"><table><tr><th>Personne</th><th>Vaccin</th><th>Dose</th><th>Date</th><th>Lot</th><th>Prochain rappel</th></tr>${rows.map(v=>`<tr><td>${esc(v.full_name)}</td><td>${esc(v.vaccine)}</td><td>${esc(v.dose)}</td><td>${esc(v.vaccination_date)}</td><td>${esc(v.lot)}</td><td>${esc(v.next_reminder)}</td></tr>`).join("")}</table></div></div>`}
async function newVacc(){let ps=await req("/people");if(!ps.length)return alert("Ajoutez d'abord une personne.");let p=prompt("ID de la personne :\n"+ps.map(x=>x.id+" — "+x.full_name).join("\n"));if(!p)return;let vaccine=prompt("Vaccin (ex. BCG, Penta, VPO, RR...)");if(!vaccine)return;let date=prompt("Date de vaccination (AAAA-MM-JJ)",new Date().toISOString().slice(0,10));let dose=prompt("Dose")||"",lot=prompt("N° de lot")||"",next=prompt("Prochain rappel (AAAA-MM-JJ, facultatif)")||"";try{await req("/vaccinations",{method:"POST",body:{person_id:Number(p),vaccine,dose,vaccination_date:date,lot,next_reminder:next}});toast("Vaccination enregistrée");vaccinations()}catch(e){alert(e.message)}}
async function adminPage(){let [cs,us,au]=await Promise.all([req("/centers"),req("/users"),req("/audit")]);$("#content").innerHTML=`<div class="grid"><div class="card"><h2>Centres</h2><button onclick="addCenter()">+ Centre</button><ul>${cs.map(c=>`<li>${esc(c.name)} — ${esc(c.location)}</li>`).join("")}</ul></div><div class="card"><h2>Utilisateurs</h2><button onclick="addUser()">+ Utilisateur</button><div style="overflow:auto"><table><tr><th>Nom</th><th>Email</th><th>Rôle</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td></tr>`).join("")}</table></div></div></div>
<div class="card"><h2>Journal d'activité</h2><div style="overflow:auto"><table><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Objet</th></tr>${au.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} #${esc(a.entity_id)}</td></tr>`).join("")}</table></div></div>`}
async function addCenter(){let name=prompt("Nom du centre");if(!name)return;let location=prompt("Ville / localisation")||"";try{await req("/centers",{method:"POST",body:{name,location}});toast("Centre créé");adminPage()}catch(e){alert(e.message)}}
async function addUser(){let name=prompt("Nom"),email=prompt("Email"),password=prompt("Mot de passe temporaire"),role=prompt("Rôle: admin ou agent","agent");if(!name||!email||!password)return;try{await req("/users",{method:"POST",body:{name,email,password,role}});toast("Utilisateur créé");adminPage()}catch(e){alert(e.message)}}
if(token) render(); else login();
</script></body></html>
